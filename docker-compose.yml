services:
  stock-univert:
    image: nginx:alpine
    container_name: stock-univert
    restart: unless-stopped
    environment:
      - APP_URL=https://raw.githubusercontent.com/jeremycarbonneau1-collab/GESTION-STOCK-UV/refs/heads/main/index.html
    entrypoint:
      - /bin/sh
      - -c
      - 'if wget -q -O /tmp/index.html "$$APP_URL" && [ -s /tmp/index.html ]; then cp /tmp/index.html /usr/share/nginx/html/index.html && echo "index.html mis a jour depuis GitHub"; else echo "Telechargement impossible : version actuelle conservee"; fi; exec nginx -g "daemon off;"'
    volumes:
      - ./html:/usr/share/nginx/html
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stock-univert.rule=Host(`stock-univert.srv1745823.hstgr.cloud`)"
      - "traefik.http.routers.stock-univert.entrypoints=websecure"
      - "traefik.http.routers.stock-univert.tls.certresolver=mytlschallenge"
      - "traefik.http.services.stock-univert.loadbalancer.server.port=80"
networks:
  n8n_default:
    external: true
