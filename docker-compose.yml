services:
  stock-univert:
    image: nginx:alpine
    container_name: stock-univert
    restart: unless-stopped
    environment:
      - APP_URL=https://raw.githubusercontent.com/jeremycarbonneau1-collab/GESTION-STOCK-UV/refs/heads/main
    entrypoint:
      - /bin/sh
      - -c
      - 'for f in index.html bascule.html; do if wget -q -O /tmp/$$f "$$APP_URL/$$f" && [ -s /tmp/$$f ]; then cp /tmp/$$f /usr/share/nginx/html/$$f && echo "$$f mis a jour depuis GitHub"; else echo "$$f : telechargement impossible, version actuelle conservee"; fi; done; exec nginx -g "daemon off;"'
    volumes:
      - ./html:/usr/share/nginx/html
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stock-univert.rule=Host(`stock-univert.srv1745823.hstgr.cloud`)"
      - "traefik.http.routers.stock-univert.entrypoints=websecure"
      - "traefik.http.routers.stock-univert.tls.certresolver=mytlschallenge"
      - "traefik.http.services.stock-univert.loadbalancer.server.port=80"
networks:
  n8n_default:
    external: true
